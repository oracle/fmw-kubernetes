      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/OIGUI`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/weblogic`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
{{- end }}
{{- end }}
{{- end }}
