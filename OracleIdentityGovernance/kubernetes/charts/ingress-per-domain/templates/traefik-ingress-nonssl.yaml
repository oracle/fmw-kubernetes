      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/HTTPClnt`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/reqsvc`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/iam`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/provisioning-callback`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/CertificationCallbackService`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/ucs`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
