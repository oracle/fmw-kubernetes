{{- if eq .Values.type "TRAEFIK" }}
{{- if (eq .Values.sslType "NONSSL") }}
{{- if not .Values.hostName.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.wlsDomain.domainUID }}-traefik
  namespace: {{ .Release.Namespace }}
  labels:
    weblogic.resourceVersion: domain-v2
  annotations:
    kubernetes.io/ingress.class: 'traefik'
spec:
  entryPoints:
  - web
  routes:
  - match: PathPrefix(`/console`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-{{ .Values.wlsDomain.adminServerName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.adminServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/consolehelp`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-{{ .Values.wlsDomain.adminServerName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.adminServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/em`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-{{ .Values.wlsDomain.adminServerName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.adminServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/ws_utc`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.soaClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.soaManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/soa`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.soaClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.soaManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/integration`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.soaClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.soaManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/soa-infra`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.soaClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.soaManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/identity`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/admin`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/dms`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-{{ .Values.wlsDomain.adminServerName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.adminServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/oim`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/sysadmin`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/workflowservice`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/callbackResponseService`)
    kind: Rule
    services:
    - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
      port: {{ .Values.wlsDomain.oimManagedServerPort }}
      sticky:
        cookie:
          name: sticky-cookie
          httpOnly: true
  - match: PathPrefix(`/spml-xsd`)
