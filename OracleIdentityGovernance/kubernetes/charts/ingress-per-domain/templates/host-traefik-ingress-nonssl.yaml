          port: {{ .Values.wlsDomain.adminServerPort }}
          sticky:
            cookie:
              name: sticky-cookie
              httpOnly: true
    - match: Host(`{{ .Values.hostName.admin }}`) && PathPrefix(`/oim`)
      kind: Rule
      services:
        - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
          port: {{ .Values.wlsDomain.oimManagedServerPort }}
          sticky:
            cookie:
              name: sticky-cookie
              httpOnly: true
    - match: Host(`{{ .Values.hostName.admin }}`) && PathPrefix(`/sysadmin`)
      kind: Rule
      services:
        - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
          port: {{ .Values.wlsDomain.oimManagedServerPort }}
          sticky:
            cookie:
              name: sticky-cookie
              httpOnly: true
    - match: Host(`{{ .Values.hostName.admin }}`) && PathPrefix(`/admin`)
      kind: Rule
      services:
        - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.oimClusterName | lower | replace "_" "-" }}'
