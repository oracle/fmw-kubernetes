{{- if eq .Values.type "TRAEFIK" }}
{{- if (eq .Values.sslType "NONSSL") }}
{{- if .Values.hostName.enabled }}

{{- if .Values.hostName.admin }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oigadmin-ingressroute
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.hostName.admin }}`) && PathPrefix(`/console`)
      kind: Rule
      services:
        - name: '{{ .Values.wlsDomain.domainUID }}-{{ .Values.wlsDomain.adminServerName | lower | replace "_" "-" }}'
          port: {{ .Values.wlsDomain.adminServerPort }}
          sticky:
            cookie:
              name: sticky-cookie
              httpOnly: true
    - match: Host(`{{ .Values.hostName.admin }}`) && PathPrefix(`/consolehelp`)
      kind: Rule
      services:
        - name: '{{ .Values.wlsDomain.domainUID }}-{{ .Values.wlsDomain.adminServerName | lower | replace "_" "-" }}'
          port: {{ .Values.wlsDomain.adminServerPort }}
          sticky:
            cookie:
              name: sticky-cookie
              httpOnly: true
    - match: Host(`{{ .Values.hostName.admin }}`) && PathPrefix(`/em`)
