          sticky:
            cookie:
              name: sticky-cookie
              httpOnly: true
    - match: Host(`{{ .Values.hostName.admin }}`) && PathPrefix(`/dms`)
      kind: Rule
      services:
        - name: '{{ .Values.wlsDomain.domainUID }}-{{ .Values.wlsDomain.adminServerName | lower | replace "_" "-" }}'
          port: {{ .Values.wlsDomain.adminServerPort }}
          sticky:
            cookie:
              name: sticky-cookie
              httpOnly: true
    - match: Host(`{{ .Values.hostName.admin }}`) && PathPrefix(`/soa-infra`)
      kind: Rule
      services:
        - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.soaClusterName | lower | replace "_" "-" }}'
          port: {{ .Values.wlsDomain.soaManagedServerPort }}
          sticky:
            cookie:
              name: sticky-cookie
              httpOnly: true
    - match: Host(`{{ .Values.hostName.admin }}`) && PathPrefix(`/ws_utc`)
      kind: Rule
      services:
        - name: '{{ .Values.wlsDomain.domainUID }}-cluster-{{ .Values.wlsDomain.soaClusterName | lower | replace "_" "-" }}'
